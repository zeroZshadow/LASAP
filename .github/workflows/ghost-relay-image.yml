# Builds the ghost relay's container image (docker/ghost-relay/Dockerfile) when a GitHub release is published and
# pushes it to the GitHub Container Registry as ghcr.io/<owner>/las-ghost-relay, tagged latest, the release's version,
# protocol-<PROTOCOL_VERSION> and the commit.
name: Ghost relay image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/las-ghost-relay"
          protocol="$(sed -n 's/^PROTOCOL_VERSION = \([0-9]*\)$/\1/p' apworld/las/ghost_relay.py)"
          test -n "$protocol"
          {
            echo "TAGS<<EOF"
            echo "$image:latest"
            echo "$image:${GITHUB_REF_NAME#v}"
            echo "$image:protocol-$protocol"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ghost-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
