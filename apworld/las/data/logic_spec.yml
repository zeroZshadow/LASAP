  can-steal, chest-animations, chests, classic-d2, companions, completed-bridge, consumable-drops,
  create-spoiler-log, dampe, disable-guardian-acorn, disable-low-health-beep, disable-piece-of-power, easy-fishing,
  fast-fishing, fast-stalfos, fishing, free-book, free-gifts, golden-leaves, heart-pieces, instant-text,
  item-get-animations, key-animations, map-tracker, miscellaneous, movement-speed, nice-bombs, nice-hookshot,
