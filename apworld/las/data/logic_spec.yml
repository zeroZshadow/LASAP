# The options the world always leaves off: a rule never holds through one of them.
always-off: [bad-pets, blur-removal, companions, create-spoiler-log, disable-low-health-beep, item-get-animations, race-mode,
  randomize-environments, randomize-sound-effects, randomize-text, trendy-game, unrandomizer-mode]

# A counted group: `name:N` holds with N different items of it.
counted:
  instruments: [full-moon-cello, conch-horn, sea-lilys-bell, surf-harp, wind-marimba, coral-triangle,
    evening-calm-organ, thunder-drum]
