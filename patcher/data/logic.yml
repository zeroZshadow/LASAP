bomb-arrows:
  type: interaction
  condition-basic: bombs & shoot-arrows
# powders, bombs and shoot-arrows also refill by the item Link holds: a cut bush or a lifted rock (break-bush) drops
# from ItemDrop's Grass row, which Consumable Drops (always on) gives powder, bombs and arrows; the Ammo Ghost in
# Tarin's house (ammo-ghost, in Mabe) tops them up. Both give only what Link already has. break-bush also takes powder
# and bombs: the logic's fixed point never lets a refill pay for itself.
bombs:
  type: interaction
  condition-basic: (((mabe & boots) | (can-shop & bomb) | (break-pot & (kanalet-inside | (D0-8C & ((can-farm-rupees & reduced-farming & powders) | kill-goblin[heavy])) | key-cavern | D6-8D)) | (rapids & (feather | boomerang)) | (angler-tunnel & (sword | feather | boomerang))) & (bomb | !shuffled-bombs)) | (bomb & (break-bush | (ammo-ghost & mabe)))
powders:
  type: interaction
  condition-basic: (((color-dungeon & (can-farm-rupees | break-pot)) | (feather & ((D2-7D & hit-crystal-switch) | (D8-8D & ((kill-vire & break-pot) | key-D8:2)) | (D8-4C & hookshot))) | (rapids & (feather | boomerang))) & (powder | !shuffled-powder)) | (powder & (break-bush | (ammo-ghost & mabe)))
shoot-arrows:
  type: interaction
  condition-basic: bow & (can-shop | (break-pot & (armos-maze | D6-8D)) | (feather & ((D5-7F & kill-helmasaur) | (D8-8D & key-D8:2))) | (D8-4C & (feather | break-pot)) | arrow-capacity | break-bush | (ammo-ghost & mabe))
can-shop:
  type: interaction
  condition-basic: can-farm-rupees | can-steal & (sword | !stealing-needs-sword)
can-farm-rupees:
  type: interaction
  condition-basic: bracelet | sword | rod | boomerang | shovel # | kill-octorok: removed because it sucks + enemy rando is a thing now
dash-jump:
  type: interaction
  condition-basic: feather & boots

