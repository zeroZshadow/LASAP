# Link's Awakening for Logic Studio: where its data is and where an export goes. Paths are relative to this file.
spec: ../apworld/las/data/logic_spec.yml  # what the logic must have: names, levels, items, options, grammar
doors: ../apworld/las/data/doors.yml  # which door leads to which
checks: checks.yml  # every check: its place (game tooling) and what it holds (by hand)
places: places.json  # levels, rooms, teleports, door marks, and where the pictures go
maps: maps  # a picture of each level's top-down rooms and of each side-view room
names: ../apworld/las/data/location_names.json  # each check's name in the game
locations: ../apworld/las/data/ids.json  # `locations`: every check the world knows
export: [../apworld/las/data/logic.yml]  # the world's; the patcher reads it too (las_ap_patch.DATA_DIR)
simulator: tools/simulator.py  # answers what holds with the real world (DATA.md has the protocol)
simulator_hidden_items: ["*-trap", "rupee-*", "compass-*", "map-*", stalfos-note, heart-container, heart-piece, medicine]  # never needed by logic: left out of the Simulator's menu while no rule reads them
simulator_hidden_options:  # switches for the generator, not logic: left out of the Simulator's menu while no rule reads them
  [360-movement, blue-rupees, blur-removal, boss-cutscenes, boss-drops, bouncy-items, chest-animations, chests, companions, consumable-drops,
   create-spoiler-log, dampe, disable-guardian-acorn, disable-low-health-beep, disable-piece-of-power, easy-fishing, fishing, free-gifts,
   golden-leaves, heart-pieces, instant-text, item-get-animations, key-animations, map-tracker, miscellaneous, movement-speed, nice-bombs,
   nice-hookshot, nice-magic-rod, race-mode, randomize-enemies, randomize-enemy-sizes, randomize-environments, randomize-sound-effects,
   randomize-text, seashell-hunt, seashells, seashells-important, shop, shuffled-dungeons, song-cutscenes, trade-important, trade-quest,
   trendy-game, unrandomizer-mode]
tests: tools/world_tests.py  # lists and runs the world's tests the Tests panel shows
locks:  # door marks that are locks: the item that opens them and whether opening one spends it
  K: {item: "key-{scope}", spent: true}
  L: {item: "key-{scope}", spent: true}
  N: {item: "nightmare-key-{scope}", spent: false}
lock_scopes: {Lv01TailCave: D1, Lv02BottleGrotto: D2, Lv03KeyCavern: D3, Lv04AnglersTunnel: D4, Lv05CatfishsMaw: D5, Lv06FaceShrine: D6, Lv07EagleTower: D7, Lv08TurtleRock: D8, Lv10ClothesDungeon: D0}
zone_prefixes: {Lv01TailCave: D1, Lv02BottleGrotto: D2, Lv03KeyCavern: D3, Lv04AnglersTunnel: D4, Lv05CatfishsMaw: D5, Lv06FaceShrine: D6, Lv07EagleTower: D7, Lv08TurtleRock: D8, Lv10ClothesDungeon: D0}  # what a zone painted new is named from: D1-a; other levels use their own zone name
door_marks:  # what the route form of a door mark that is no lock starts from: its rule, and the way it passes when it passes one way only
  B: {rule: bombs}
  "↑": {one_way: north}
room_versions:  # rooms that are one place stored twice: Eagle's Tower's top floor, before and after it falls; its centre rooms differ and are separate rooms
  - [Lv07EagleTower_05F, Lv07EagleTower_01F]
  - [Lv07EagleTower_05G, Lv07EagleTower_01G]
  - [Lv07EagleTower_06E, Lv07EagleTower_02E]
  - [Lv07EagleTower_06H, Lv07EagleTower_02H]
  - [Lv07EagleTower_07E, Lv07EagleTower_03E]
  - [Lv07EagleTower_07H, Lv07EagleTower_03H]
  - [Lv07EagleTower_08F, Lv07EagleTower_04F]
  - [Lv07EagleTower_08G, Lv07EagleTower_04G]
world: ../apworld/las  # the world's Python Logic Studio still reads (DATA.md)
sources: [../apworld/las, ../patcher]  # code and data that write node names a rename does not reach
